name: Encrypted feedback storage backup

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

concurrency:
  group: feedback-storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_BACKUP_KEY: ${{ secrets.SUPABASE_BACKUP_KEY }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      STORAGE_BUCKET: feedback
      STORAGE_BACKUP_DIR: storage-backup-work
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --omit=dev
      - name: Download feedback storage
        run: node .github/scripts/backup-feedback-storage.mjs
      - name: Package backup
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "created_at_utc=$(date -u +'%Y-%m-%dT%H-%M-%SZ')" \
            "repository=${GITHUB_REPOSITORY}" \
            "run_id=${GITHUB_RUN_ID}" \
            "bucket=${STORAGE_BUCKET}" \
            > storage-backup-work/workflow-manifest.txt
          tar -C storage-backup-work -czf feedback-storage-backup.tar.gz \
            objects manifest.json workflow-manifest.txt
